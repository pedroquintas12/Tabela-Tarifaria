version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: grupo_ras_postgres
    environment:
      POSTGRES_DB: tarifas
      POSTGRES_USER: grupo_ras
      POSTGRES_PASSWORD: 123456
    ports:
      - "4000:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: grupo_ras_app
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tarifas
      SPRING_DATASOURCE_USERNAME: grupo_ras
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_PROFILES_ACTIVE: production
      TZ: America/Recife

    restart: always

volumes:
  postgres_data:
